name: bootstrap
on: workflow_dispatch

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: |
          unzip -o spectra-mod.zip -x ".github/*" -d .
          rm -f spectra-mod.zip
      - name: Commit project files
        run: |
          git config user.name "spectra"
          git config user.email "spectra@users.noreply.github.com"
          git add -A
          git commit -m "Add Spectra project files"
          git push
